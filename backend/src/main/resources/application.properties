spring.application.name=study-assistant

# Local-only: never listen on external interfaces.
server.address=127.0.0.1
server.port=8080

# Where the SQLite database, uploaded originals and generated audio live.
app.data-dir=./data
# Open the default browser at the app URL once the server is up.
# Set to false for development (the Angular dev server on :4200 is what you open then).
app.open-browser=true

# SQLite allows one writer at a time; a single pooled connection avoids
# "database is locked" errors, and WAL mode keeps readers from blocking it.
spring.datasource.url=jdbc:sqlite:${app.data-dir}/study.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Lecture PDFs can be large.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=400MB

# SSE progress streams stay open while a job runs.
spring.mvc.async.request-timeout=3600000

# Background jobs (PDF extraction, generation) run on virtual threads.
spring.threads.virtual.enabled=true

# Local model runtime (Ollama). The chat model can also be changed at runtime in Settings.
app.ollama.base-url=http://127.0.0.1:11434
app.ollama.chat-model=qwen2.5:3b
app.ollama.embed-model=nomic-embed-text
# Context window requested per call. Larger needs more VRAM for the KV cache.
app.ollama.num-ctx=8192
# Input budget per generation call (estimated tokens) and overlap between chunks.
app.ollama.chunk-tokens=3000
app.ollama.overlap-tokens=0
app.ollama.request-timeout-seconds=900

# What to generate and how.
app.generation.auto-notes=true
app.generation.language=English
app.generation.flashcard-count=20
app.generation.quiz-count=10

# PDFBox logs a warning per glyph without a Unicode mapping; that is noise here.
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR

app.ollama.repeat-penalty=1.1

# Offline text-to-speech (Kokoro via a local Python sidecar).
app.tts.python=python
app.tts.default-voice=af_heart
app.tts.batch-chars=700
